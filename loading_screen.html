<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBound Showdown – Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d5c;font-family:"Lilita One",system-ui,sans-serif}
.stage{position:relative;width:100vw;height:100vh}
canvas.bg{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;left:0;right:0;top:16%;text-align:center}
.title h1{margin:0;font-size:clamp(48px,10vw,140px);color:#ffe58a;-webkit-text-stroke:clamp(4px,.8vw,10px)#2b1d5c;text-shadow:0 .08em 0 #2b1d5c,0 .16em .3em rgba(30,10,80,.6)}
.title p{margin:.4em 0 0;font-size:clamp(16px,3vw,38px);color:#9ff0ff;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 0 #2b1d5c}
.hud{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:min(680px,90vw)}
.row{display:flex;justify-content:space-between;margin-bottom:8px;color:#fff;text-shadow:0 2px 0 #2b1d5c}
.track{height:clamp(22px,3.6vw,34px);border-radius:999px;background:#fff;border:4px solid #2b1d5c;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(43,29,92,.7)}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,#58c8ff 0 16px,#2f9bf0 16px 32px);animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:48px 0}}
.pct{position:absolute;inset:0;display:grid;place-items:center;color:#2b1d5c}
.tip{position:absolute;left:0;right:0;bottom:6%;text-align:center;color:#c8f5c0;text-shadow:0 2px 0 #2b1d5c}
.ver{position:absolute;right:2vw;bottom:2%;color:#fff;opacity:.8;text-shadow:0 1px 0 #2b1d5c}
</style>
</head>
<body>
<div class="stage">
<canvas class="bg" id="bg"></canvas>
<div class="title"><h1>SkyBound Showdown</h1><p>The Fall of the Sky Kingdom</p></div>
<div class="hud">
<div class="row"><span>LOADING...</span><span id="frags"></span></div>
<div class="track"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
</div>
<div class="tip" id="tip"></div>
<div class="ver">v1.0 · Atsila Devs</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('bg');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-innerWidth/2,innerWidth/2,innerHeight/2,-innerHeight/2,1,2000);
camera.position.z=500;
function resize(){
renderer.setSize(innerWidth,innerHeight);
camera.left=-innerWidth/2;camera.right=innerWidth/2;camera.top=innerHeight/2;camera.bottom=-innerHeight/2;
camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
const g=new THREE.Group();scene.add(g);
function rect(w,h,c,x,y){
const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c}));
m.position.set(x,y,0);g.add(m);return m;
}
function circle(r,c,x,y){
const m=new THREE.Mesh(new THREE.CircleGeometry(r,32),new THREE.MeshBasicMaterial({color:c}));
m.position.set(x,y,0);g.add(m);return m;
}
// sky
rect(innerWidth,innerHeight,0xa98be8,0,innerHeight*0.25);
rect(innerWidth,innerHeight*0.4,0x8fa2ee,0,0);
rect(innerWidth,innerHeight*0.3,0x8ed0f2,0,-innerHeight*0.15);
rect(innerWidth,innerHeight*0.25,0xbff0ee,0,-innerHeight*0.3);
// sun
const sun=circle(Math.min(innerWidth,innerHeight)*0.12,0xfff6c8,-innerWidth*0.35,innerHeight*0.32);
// clouds
for(let i=0;i<8;i++){
const c=circle(60+Math.random()*40,0xffffff, (Math.random()-0.5)*innerWidth*0.8, innerHeight*0.1 + Math.random()*innerHeight*0.25);
c.material.transparent=true;c.material.opacity=0.7; c.userData={v:(Math.random()-0.5)*0.2};
}
// left island
const leftX=-innerWidth*0.28;
rect(innerWidth*0.32,innerHeight*0.18,0xb6f08a,leftX,-innerHeight*0.08);
rect(innerWidth*0.24,innerHeight*0.12,0x5cc06c,leftX,-innerHeight*0.16);
circle(90,0x4fbf6a,leftX,-innerHeight*0.02);
// tree
rect(18,70,0xa8744c,leftX,-innerHeight*0.02);
circle(55,0x3fae5e,leftX,20);
circle(65,0x7fdc7c,leftX+12,10);
circle(58,0xc9f7a0,leftX+6,0);
circle(8,0x9ff0ff,leftX,-5);
// waterfall
for(let i=0;i<12;i++){
const w=rect(16+i*2,innerHeight*0.7,0xffffff,leftX+95,-innerHeight*0.1);
w.material.transparent=true;w.material.opacity=0.6+i*0.03;
}
// right island
const rightX=innerWidth*0.28;
rect(innerWidth*0.34,innerHeight*0.16,0x43327a,rightX,-innerHeight*0.09);
rect(innerWidth*0.26,innerHeight*0.14,0x1e1040,rightX,-innerHeight*0.18);
circle(95,0x25133f,rightX,-innerHeight*0.02);
// fortress
rect(70,140,0x1a0e38,rightX,-innerHeight*0.05);
rect(90,170,0x1a0e38,rightX+20,-innerHeight*0.02);
rect(75,130,0x1a0e38,rightX+55,-innerHeight*0.06);
circle(14,0xff3b7c,rightX+20,60);
circle(6,0xff2e63,rightX+20,60);
// cloud sea
rect(innerWidth,innerHeight*0.25,0xffffff,0,-innerHeight*0.4);
const t0=performance.now();
function animate(){
const t=(performance.now()-t0)/1000;
g.children.forEach((m,i)=>{
if(m.userData.v)m.position.x+=m.userData.v;
});
sun.scale.setScalar(1+Math.sin(t)*0.02);
renderer.render(scene,camera);
requestAnimationFrame(animate);
}
animate();
})();
</script>
<script>
(function(){
const fill=document.getElementById('fill'),pct=document.getElementById('pct'),tip=document.getElementById('tip');
const tips=["Restore the Eternal Tree. Save Aetheria!","Flip between Material and Mirror Dimensions!","Team up to solve co-op puzzles.","Collect magical crystals to unlock abilities.","Defeat Malakar to reclaim the fragments."];
tip.textContent=tips[0];let ti=0;
setInterval(()=>{tip.style.opacity=0;setTimeout(()=>{ti=(ti+1)%tips.length;tip.textContent=tips[ti];tip.style.opacity=1;},400);},3000);
let p=0;const iv=setInterval(()=>{
p=Math.min(100,p+Math.random()*5+1);
fill.style.width=p+'%';pct.textContent=Math.floor(p)+'%';
if(p>=100)clearInterval(iv);
},100);
})();
</script>
</body>
</html>
